<!DOCTYPE html>
<html>
<head>
    <title>Register Staff - Admin</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow mx-auto" style="max-width: 500px;">
            <div class="card-header bg-dark text-white"><h4>Create Staff Account</h4></div>
            <div class="card-body">
                <form method="POST">
                    <div class="form-group">
                        <label>Username</label>
                        <input type="text" name="username" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Department / Role</label>
                        <select name="role" class="form-control">
                            <option value="finance">Finance Office</option>
                            <option value="estate">Estate Management</option>
                            <option value="store">Store Keeper</option>
                            <option value="hod">Head of Department</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">Create Account</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
