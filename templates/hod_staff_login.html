<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Head of Department Login - Gyedu Technical Institute</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #e9ecef; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .login-container { max-width: 400px; width: 100%; }
        .header { background-color: #6f42c1; padding: 20px; border-radius: 8px 8px 0 0; text-align: center; color: white; }
        .school-name { font-size: 1.3rem; font-weight: bold; margin: 0; }
        .subtitle { font-size: 0.9rem; margin: 5px 0 0 0; opacity: 0.9; }
        .card { background-color: #fff; padding: 30px; border-radius: 0 0 8px 8px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); }
        h2 { color: #333; margin-top: 0; text-align: center; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 1rem; box-sizing: border-box; }
        input:focus { outline: none; border-color: #6f42c1; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; font-weight: bold; transition: background-color 0.3s ease; }
        .btn-primary { background-color: #6f42c1; color: white; }
        .btn-primary:hover { background-color: #5a3f9e; }
        .back-link { display: block; text-align: center; margin-top: 20px; color: #6c757d; text-decoration: none; }
        .back-link:hover { text-decoration: underline; }
        .role-badge { text-align: center; margin-bottom: 20px; }
        .role-badge span { display: inline-block; padding: 5px 15px; background-color: #e2d9f3; color: #6f42c1; border-radius: 20px; font-size: 0.85rem; font-weight: bold; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="header">
            <h1 class="school-name">GYEDU TECHNICAL INSTITUTE</h1>
            <p class="subtitle">Head of Department Portal</p>
        </div>
        
        <div class="card">
            <div class="role-badge">
                <span>Head of Department</span>
            </div>
            
            <h2>Staff Login</h2>
            
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div style="padding: 10px; margin-bottom: 15px; border-radius: 4px; background-color: {% if category == 'success' %}#d4edda{% elif category == 'danger' %}#f8d7da{% else %}#fff3cd{% endif %}; color: {% if category == 'success' %}#155724{% elif category == 'danger' %}#721c24{% else %}#856404{% endif %};">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
            
            <form method="POST" action="{{ url_for('hod_staff_login') }}">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required placeholder="Enter your username" autocomplete="off">
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="Enter your password">
                </div>
                
                <button type="submit" class="btn btn-primary">Login</button>
            </form>
            
            <a href="{{ url_for('admin_login') }}" class="back-link">Back to Admin Login</a>
        </div>
    </div>
</body>
</html>
